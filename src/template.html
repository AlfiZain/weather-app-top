<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App Top</title>
  </head>
  <body>
    <main class="weather-container">
      <header class="card-header">
        <form id="searchBox" class="search-box">
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter city name"
            minlength="4"
            required />

          <button type="submit">Search</button>
        </form>
      </header>

      <section class="card-content">
        <h1 id="cardInfo">See today forecast</h1>
      </section>
    </main>
  </body>
</html>
